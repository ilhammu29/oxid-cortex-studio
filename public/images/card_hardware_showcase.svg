<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="deviceGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1f1f28"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="metalBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#070709"/>

  <!-- Ambient Glow Behind Device -->
  <circle cx="400" cy="300" r="240" fill="url(#deviceGlow)"/>

  <!-- Minimalist Chassis (Bespoke Hardware Device) -->
  <rect x="200" y="140" width="400" height="320" rx="40" fill="url(#metalBezel)" stroke="#3f3f46" stroke-width="2"/>
  
  <!-- Inner Glass Panel -->
  <rect x="225" y="165" width="350" height="270" rx="28" fill="#0d0d12" stroke="#26262e" stroke-width="1.5"/>

  <!-- Tactile Machined Knobs / Controls -->
  <circle cx="300" cy="300" r="45" fill="#181820" stroke="#ff5722" stroke-width="2"/>
  <circle cx="300" cy="300" r="30" fill="#22222e"/>
  <line x1="300" y1="270" x2="300" y2="285" stroke="#ff5722" stroke-width="3" stroke-linecap="round"/>
  <text x="270" y="370" fill="#a1a1aa" font-family="monospace" font-size="10" font-weight="bold">GAIN / TACTILE</text>

  <!-- Precision Digital Oled Meter -->
  <rect x="380" y="240" width="160" height="90" rx="14" fill="#07070a" stroke="#26262e" stroke-width="1"/>
  <text x="400" y="270" fill="#ff7a00" font-family="monospace" font-size="11">FREQUENCY</text>
  <text x="400" y="305" fill="#ffffff" font-family="monospace" font-size="24" font-weight="bold">800.4 <tspan font-size="12" fill="#10b981">MHz</tspan></text>

  <!-- Orange Status Dot & Engraving -->
  <circle cx="250" cy="200" r="4" fill="#ff5722"/>
  <text x="265" y="204" fill="#71717a" font-family="monospace" font-size="10">PWR ON</text>
  <text x="470" y="204" fill="#52525b" font-family="monospace" font-size="10">SERIES 01 // BESPOKE</text>

  <!-- Device Foot Base Shadow -->
  <ellipse cx="400" cy="490" rx="220" ry="25" fill="#000000" opacity="0.6"/>

  <text x="50" y="560" fill="#71717a" font-family="monospace" font-size="11">LUXURY MINIMALIST BESPOKE HARDWARE • PRECISION INDUSTRIAL DESIGN</text>
</svg>
