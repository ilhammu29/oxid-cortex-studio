<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fintechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fintechBg)"/>

  <!-- Bento Box 1: Total Portfolio Value -->
  <rect x="50" y="50" width="330" height="230" rx="24" fill="#121216" stroke="#26262e" stroke-width="1.5"/>
  <text x="80" y="90" fill="#71717a" font-family="monospace" font-size="11" font-weight="bold">TOTAL ASSET ALLOCATION</text>
  <text x="80" y="140" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">$1,482,900.00</text>
  <rect x="80" y="165" width="110" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="96" y="183" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">+28.4% APY</text>

  <!-- Bento Box 2: Yield Sparkline Chart -->
  <rect x="410" y="50" width="340" height="230" rx="24" fill="#121216" stroke="#26262e" stroke-width="1.5"/>
  <text x="440" y="90" fill="#71717a" font-family="monospace" font-size="11" font-weight="bold">LIQUIDITY CURVE (30D)</text>
  <!-- Area under curve -->
  <path d="M 440 220 Q 500 180 540 195 T 640 120 T 710 100 L 710 230 L 440 230 Z" fill="url(#greenGlow)"/>
  <!-- Stroke Line -->
  <path d="M 440 220 Q 500 180 540 195 T 640 120 T 710 100" fill="none" stroke="#10b981" stroke-width="3"/>
  <circle cx="710" cy="100" r="5" fill="#10b981"/>

  <!-- Bento Box 3: Candlestick High-Speed Feed -->
  <rect x="50" y="310" width="700" height="240" rx="24" fill="#121216" stroke="#26262e" stroke-width="1.5"/>
  <text x="80" y="350" fill="#ff5722" font-family="monospace" font-size="11" font-weight="bold">HIGH-FREQUENCY QUANT ENGINE FEED</text>

  <!-- Candlesticks -->
  <!-- Candle 1 -->
  <line x1="120" y1="400" x2="120" y2="480" stroke="#10b981" stroke-width="1.5"/>
  <rect x="110" y="420" width="20" height="40" fill="#10b981" rx="3"/>

  <!-- Candle 2 -->
  <line x1="170" y1="380" x2="170" y2="490" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="160" y="400" width="20" height="60" fill="#ef4444" rx="3"/>

  <!-- Candle 3 -->
  <line x1="220" y1="370" x2="220" y2="460" stroke="#10b981" stroke-width="1.5"/>
  <rect x="210" y="390" width="20" height="50" fill="#10b981" rx="3"/>

  <!-- Candle 4 -->
  <line x1="270" y1="350" x2="270" y2="440" stroke="#10b981" stroke-width="1.5"/>
  <rect x="260" y="360" width="20" height="60" fill="#10b981" rx="3"/>

  <!-- Candle 5 -->
  <line x1="320" y1="340" x2="320" y2="430" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="310" y="370" width="20" height="40" fill="#ef4444" rx="3"/>

  <!-- Candle 6 -->
  <line x1="370" y1="320" x2="370" y2="420" stroke="#10b981" stroke-width="1.5"/>
  <rect x="360" y="330" width="20" height="70" fill="#10b981" rx="3"/>

  <!-- Metrics info on right side -->
  <g transform="translate(480, 370)">
    <rect x="0" y="0" width="220" height="40" rx="12" fill="#1a1a24" stroke="#26262e" stroke-width="1"/>
    <text x="15" y="25" fill="#a1a1aa" font-family="monospace" font-size="11">Volatility Index: <tspan fill="#ffffff" font-weight="bold">12.4%</tspan></text>

    <rect x="0" y="55" width="220" height="40" rx="12" fill="#1a1a24" stroke="#26262e" stroke-width="1"/>
    <text x="15" y="80" fill="#a1a1aa" font-family="monospace" font-size="11">Execution Latency: <tspan fill="#10b981" font-weight="bold">0.8ms</tspan></text>

    <rect x="0" y="110" width="220" height="40" rx="12" fill="#ff5722" fill-opacity="0.1" stroke="#ff5722" stroke-width="1"/>
    <text x="15" y="135" fill="#ff5722" font-family="monospace" font-size="11">Bento Architecture: <tspan font-weight="bold">Verified</tspan></text>
  </g>
</svg>
