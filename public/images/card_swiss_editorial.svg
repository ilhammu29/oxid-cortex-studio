<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0e0e12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#paperGrad)"/>

  <!-- High-Contrast Swiss Typography Grid -->
  <rect x="50" y="50" width="700" height="500" rx="20" fill="#121216" stroke="#26262e" stroke-width="1.5"/>

  <!-- Red Accent Box (International Typographic Style) -->
  <rect x="80" y="80" width="28" height="28" fill="#ff3b00"/>

  <text x="120" y="100" fill="#a1a1aa" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="3">SWISS MODERNISM • ISSUE 04</text>
  <text x="640" y="100" fill="#71717a" font-family="monospace" font-size="11">NOV 2026</text>

  <!-- Giant Headline with Surgical Contrast -->
  <text x="80" y="180" fill="#ffffff" font-family="serif" font-size="52" font-weight="900" letter-spacing="-1">Typographic</text>
  <text x="80" y="240" fill="#ff5722" font-family="serif" font-size="52" font-weight="900" letter-spacing="-1">Architecture.</text>

  <!-- Horizontal Divider Rule -->
  <line x1="80" y1="280" x2="720" y2="280" stroke="#26262e" stroke-width="2"/>

  <!-- 3 Text Columns (Classic Asymmetric Grid) -->
  <g transform="translate(80, 310)">
    <text x="0" y="20" fill="#e4e4e7" font-family="sans-serif" font-size="14" font-weight="bold">I. MATHEMATICAL GRID</text>
    <text x="0" y="45" fill="#a1a1aa" font-family="sans-serif" font-size="11" width="180">
      Hierarki visual dirancang berbasis
    </text>
    <text x="0" y="65" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      grid 12-kolom dengan whitespace
    </text>
    <text x="0" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      yang luas dan keterbacaan tinggi.
    </text>
  </g>

  <g transform="translate(300, 310)">
    <text x="0" y="20" fill="#e4e4e7" font-family="sans-serif" font-size="14" font-weight="bold">II. HUMAN CONTRAST</text>
    <text x="0" y="45" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      Kombinasi font Lora Serif untuk
    </text>
    <text x="0" y="65" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      headline berwibawa dan font
    </text>
    <text x="0" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      Jakarta Sans untuk kenyamanan baca.
    </text>
  </g>

  <g transform="translate(520, 310)">
    <text x="0" y="20" fill="#ff5722" font-family="sans-serif" font-size="14" font-weight="bold">III. ANTI-SLOP CODE</text>
    <text x="0" y="45" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      Bebas dari gradasi generik AI,
    </text>
    <text x="0" y="65" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      murni mengandalkan ketajaman
    </text>
    <text x="0" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="11">
      kontras tipografi editorial.
    </text>
  </g>

  <!-- Editorial Badge Footer -->
  <rect x="80" y="450" width="640" height="60" rx="14" fill="#0d0d12" stroke="#26262e" stroke-width="1"/>
  <text x="110" y="485" fill="#71717a" font-family="monospace" font-size="11">STANDAR JURNALISME KELAS DUNIA • KURASI AIRA &amp; MINHAM STUDIO</text>
</svg>
